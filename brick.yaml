name: flutter_clean_architecture
description: A Flutter project template with Clean Architecture, BLoC, multi-environment setup, and comprehensive core infrastructure
version: 2.0.0
repository: https://github.com/Hayan47/Flutter-Project-Starter

vars:
  project_name:
    type: string
    description: The project folder name, kept exactly as entered (e.g. my-app). The Dart package name is derived as snake_case (my_app).
    prompt: What is your project name?

  project_description:
    type: string
    description: A brief description of your project
    prompt: Enter project description
    default: A new Flutter project with Clean Architecture

  app_id:
    type: string
    description: Full application ID, used as the Android applicationId/namespace and the iOS bundle ID (e.g. com.company.app)
    prompt: What is your app ID / bundle ID? (e.g. com.company.app)
    default: com.example.app

  dev_api_url:
    type: string
    description: Development API base URL
    prompt: Enter development API URL
    default: https://dev-api.example.com

  prod_api_url:
    type: string
    description: Production API base URL
    prompt: Enter production API URL
    default: https://api.example.com

  include_localization:
    type: boolean
    description: Include easy_localization setup with English and Arabic support
    prompt: Include localization support?
    default: true

  include_maps:
    type: boolean
    description: Include Google Maps, Geolocator, and Geocoding packages
    prompt: Include maps and location features?
    default: false

  include_image_picker:
    type: boolean
    description: Include image picker and file handling packages
    prompt: Include image picker and file handling?
    default: true

  include_fcm_notifications:
    type: boolean
    description: Include FCM notifications feature
    prompt: Include FCM notifications feature?
    default: true

  use_jwt_auth:
    type: boolean
    description: Include JWT token refresh mechanism with automatic retry on 401 errors
    prompt: Include JWT authentication with token refresh?
    default: true

  primary_color:
    type: string
    description: Primary color hex code (e.g. 1976D2 or #1976D2)
    prompt: Enter primary color hex
    default: "1976D2"

  secondary_color:
    type: string
    description: Secondary color hex code (e.g. 424242 or #424242)
    prompt: Enter secondary color hex
    default: "424242"

  use_fvm:
    type: boolean
    description: Use Flutter Version Manager (FVM) for this project
    prompt: Use FVM for Flutter version management?
    default: false

  flutter_version:
    type: string
    description: Flutter version to use with FVM (e.g., 3.24.0, stable)
    prompt: Flutter version for FVM (only used if FVM is enabled)
    default: "stable"

environment:
  mason: ">=0.1.0 <1.0.0"
